[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "matchpulse-ml-inference"
version = "0.1.0"
description = "Opt-in MatchPulse complete-window inference client and Modal workers"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
modal = ["modal==1.6.3"]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["ml_inference"]
package-dir = {ml_inference = "."}

[tool.setuptools.package-data]
ml_inference = ["runtime/*.json", "runtime/*.whl", "requirements-worker.txt", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
